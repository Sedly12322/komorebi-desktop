[package]
name = "komorebi-desktop"
version = "3.0.0"
edition = "2021"
description = "Ultra-fast Rust desktop wallpaper & avatar browser (Wallhaven, MoeWalls, osu!, pfps.gg)"
license = "MIT"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "charset", "http2", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico"] }
regex = "1"
sha2 = "0.10"
hex = "0.4"
dirs = "6"
rfd = "0.15"
arboard = "3"
open = "5"
html-escape = "0.2"
urlencoding = "2"
rand = "0.8"
crossbeam-channel = "0.5"
rayon = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
