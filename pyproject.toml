[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "komorebi-desktop"
version = "2.0.0"
authors = [
  { name = "Sedly12322" }
]
description = "Modern wallpaper & avatar browser (Wallhaven, MoeWalls, osu!, pfps.gg) for Linux & Windows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Environment :: X11 Applications :: Qt",
  "Topic :: Desktop Environment",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "PyQt6>=6.6.0",
  "requests>=2.31.0",
  "pillow>=10.0.0",
]

[project.scripts]
komorebi = "wallhaven.app:main"
komorebi-desktop = "wallhaven.app:main"
wallhaven = "wallhaven.app:main"
wallhaven-desktop = "wallhaven.app:main"

[project.urls]
Homepage = "https://github.com/Sedly12322/komorebi-desktop"
Repository = "https://github.com/Sedly12322/komorebi-desktop"
Issues = "https://github.com/Sedly12322/komorebi-desktop/issues"

[tool.setuptools.packages.find]
include = ["wallhaven*"]

[tool.setuptools.package-data]
"wallhaven" = ["data/*.json"]

